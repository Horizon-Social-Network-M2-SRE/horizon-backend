[project]
name = "horizon-backend"
version = "0.1.0"
description = "Horizon social network backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "pymongo>=4.10",
    "redis>=5.2",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # Same release as CI (ruff-version of horizon-infrastructure's python-ci.yml).
    "ruff==0.17.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
