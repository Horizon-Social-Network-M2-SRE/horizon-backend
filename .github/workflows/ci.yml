name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Shared checks from horizon-infrastructure (S1-02): ruff, pytest with MongoDB and Redis, gitleaks,
  # then the image built, scanned with Trivy and pushed to GHCR (sha-<commit> and main) on main.
  # Check names: ci / lint, ci / test, ci / secrets, ci / image.
  ci:
    uses: Horizon-Social-Network-M2-SRE/horizon-infrastructure/.github/workflows/python-ci.yml@feature/1-reusable-ci
    permissions:
      contents: read
      packages: write
    with:
      mongo-image: mongo:7
      redis-image: redis:7

  # Backend-specific runtime checks on the image (health, JWT_SECRET required, non-root).
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t horizon-backend:ci .
      - name: Health answers in the container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" horizon-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Refuses to start without JWT_SECRET
        run: |
          if docker run --rm horizon-backend:ci python -c "import app.main"; then
            echo "app started without JWT_SECRET"; exit 1
          fi
      - name: Runs as non-root
        run: test "$(docker exec api id -u)" != "0"
