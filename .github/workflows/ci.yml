name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -ra

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t horizon-backend:ci .
      - name: Health answers in the container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" horizon-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Refuses to start without JWT_SECRET
        run: |
          if docker run --rm horizon-backend:ci python -c "import app.main"; then
            echo "app started without JWT_SECRET"; exit 1
          fi
      - name: Runs as non-root
        run: test "$(docker exec api id -u)" != "0"
